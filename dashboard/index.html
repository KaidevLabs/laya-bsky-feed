<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laya Sky Feed — live</title>
<style>
  :root { --bg:#0e1116; --card:#161b24; --line:#2a3140; --text:#e7ecf3;
          --dim:#8b95a7; --a:#31c274; --b:#6b7484; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:14px/1.45 system-ui,sans-serif; }
  header { position:sticky; top:0; z-index:1; display:flex; gap:12px;
           align-items:baseline; padding:10px 16px; background:var(--bg);
           border-bottom:1px solid var(--line); }
  h1 { margin:0; font-size:15px; font-weight:600; }
  #stat { color:var(--dim); font-size:12px; }
  #feed { max-width:720px; margin:0 auto; padding:12px 16px 96px; }
  .card { background:var(--card); border:1px solid var(--line);
          border-radius:8px; padding:10px 12px; margin-bottom:10px; }
  .text { display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical;
          overflow:hidden; word-break:break-word; }
  .bar { display:flex; height:5px; margin-top:8px; border-radius:3px;
         overflow:hidden; background:var(--line); }
  .bar .a { background:var(--a); }
  .bar .b { background:var(--b); flex:1; }
  .meta { display:flex; flex-wrap:wrap; gap:4px 10px; align-items:center;
          margin-top:6px; color:var(--dim); font-size:12px; }
  .chip { padding:1px 8px; border-radius:10px; font-size:11px; font-weight:600; }
  .chip.a { color:var(--a); background:rgba(49,194,116,.14); }
  .chip.b { color:var(--b); background:rgba(107,116,132,.18); }
  .who { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
</style>
</head>
<body>
<header>
  <h1>Laya Sky Feed</h1>
  <span id="stat">loading history…</span>
</header>
<div id="feed"></div>
<script>
"use strict";
const feed = document.getElementById("feed");
const stat = document.getElementById("stat");
const MAX_CARDS = 50;

function relTime(iso) {
  const t = new Date(iso).getTime();
  if (isNaN(t)) return "";
  const s = Math.max(0, (Date.now() - t) / 1000);
  if (s < 60) return Math.round(s) + "s ago";
  if (s < 3600) return Math.round(s / 60) + "m ago";
  if (s < 86400) return Math.round(s / 3600) + "h ago";
  return Math.round(s / 86400) + "d ago";
}
const clamp01 = (x) => Math.max(0, Math.min(1, Number(x) || 0));

function makeCard(item) {
  const pa = clamp01(item.probabilities && item.probabilities.A);
  const pb = clamp01(item.probabilities && item.probabilities.B);
  const el = document.createElement("div");
  el.className = "card";
  el.dataset.uri = item.uri || "";
  el.dataset.probA = pa.toFixed(4);
  el.dataset.probB = pb.toFixed(4);
  const text = document.createElement("div");
  text.className = "text";
  // The decision log has no `text` field yet; the AT URI identifies the post.
  text.textContent = item.text || item.uri || "";
  const meta = document.createElement("div");
  meta.className = "meta";
  const chip = document.createElement("span");
  chip.className = "chip " + (item.verdict === "A" ? "a" : "b");
  chip.textContent = item.verdict === "A" ? "show" : "noise";
  const who = document.createElement("span");
  who.className = "who";
  who.textContent = "@" + (item.author || "?");
  const when = document.createElement("span");
  when.textContent = relTime(item.created_at);
  meta.append(chip, who, when);
  const bar = document.createElement("div");
  bar.className = "bar";
  const a = document.createElement("div");
  a.className = "a";
  a.style.width = (pa * 100).toFixed(2) + "%";
  const b = document.createElement("div");
  b.className = "b";
  bar.append(a, b);
  const conf = document.createElement("div");
  conf.className = "meta";
  conf.textContent = "A " + (pa * 100).toFixed(1) + "% · B " +
    (pb * 100).toFixed(1) + "% · conf " +
    (clamp01(item.confidence) * 100).toFixed(1) + "%";
  el.append(text, meta, bar, conf);
  return el;
}

function prependCard(item) {
  feed.prepend(makeCard(item));
  while (feed.children.length > MAX_CARDS) feed.lastElementChild.remove();
  stat.textContent = feed.children.length + " cards · " +
    new Date().toLocaleTimeString();
}

fetch("/history?n=20")
  .then(r => r.json())
  .then(d => (d.items || []).forEach(prependCard))   // load-time only
  .catch(() => { stat.textContent = "history unavailable"; });

const es = new EventSource("/stream");                // SSE is the live channel;
es.onmessage = e => {                                // no polling, no custom
  try { prependCard(JSON.parse(e.data)); }           // reconnect logic.
  catch (_) {}
};
</script>
</body>
</html>
